<!doctype html><meta charset="utf-8"><style>body { margin: 0; } /*__CSS__*/</style>
<body class="desktop"><script>
// Small jQuery adapter uses real elements, native selects and browser event dispatch.
class Query {
 constructor(html) { const t = document.createElement('template'); t.innerHTML = html; this.el = t.content.firstChild; this.events = new Map(); }
 text(v) { if(!arguments.length) return this.el.textContent; this.el.textContent = v; return this; }
 val(v) { if (!arguments.length) return this.el.value; this.el.value = v; return this; }
 prop(k,v) { this.el[k] = v; return this; }
 append(...v) { this.el.append(...v.map(q => q.el)); return this; }
 on(k,fn) { this.events.set(k,fn); this.el.addEventListener(k,fn); return this; }
 off(k) { this.el.removeEventListener(k,this.events.get(k)); return this; }
}
const $ = html => new Query(html);
let content = 'import os\ndef main():\n    print(os.getcwd())';
const original = content, labels = new Map();
let mime = 'text/plain';
const note = Object.freeze({noteId:'example', type:'code', get mime() {return mime;},
 getContent: async () => content, getOwnedLabelValue: k => labels.get(k),
 getOwnedLabels: k => labels.has(k) ? [{attributeId:"lock-id", value:labels.get(k), isInheritable:false}] : []});
window.glob = {baseApiUrl: '/lore/api/', csrfToken: 'FIXTURE_CSRF'};
const api = { NoteContextAwareWidget: class { contentSized() {} cleanup() {} },
 runOnBackend: async () => {throw Error('Backend scripting disabled');},
 reloadNotes: async () => {
  const response = await fetch('/lore/api/fixture-labels');
  const durable = await response.json(); // Native cache retains deleted labels until entity delivery.
  mime = durable.mime;
  for (const [k,v] of Object.entries(durable.labels)) labels.set(k,v);
 }, getNote: async () => note };
const module = {exports:{}};
/*__CONTROLLER__*/
(async () => {
 const assert = (v,m) => {if(!v) throw Error(m);};
 const settle = async () => { for(let i=0; widget.lockBusy && i<1500; i++) await new Promise(r=>setTimeout(r,10)); assert(!widget.lockBusy, 'lock request completed'); };
 const widget = module.exports; widget.note = note; document.body.append(widget.doRender().el);
 await widget.refreshWithNote(note);
 await settle();
 assert(widget.$language.el.textContent.includes('Python · Auto'), 'auto detection');
 assert(mime === 'text/x-python', 'native auto MIME');
 assert(widget.$highlighting.el.textContent === 'Highlighting: Python', 'native auto status');
 assert(widget.$picker.el.options.length === 9, 'nine themes');
 widget.$picker.val('mariana').el.dispatchEvent(new Event('change'));
 assert(localStorage.getItem(THG_STORAGE) === 'mariana', 'theme persistence');
 widget.$languagePicker.el.focus();
 if(innerWidth > 900) await fetch('/keyboard/rust', {method:'POST'});
 else widget.$languagePicker.val('rust').el.dispatchEvent(new Event('change'));
 // Allow the async native request and refresh chain to settle.
 await settle();
 assert(labels.get('thgSublimeLanguage') === 'rust', 'native select saves lock');
 assert(widget.$language.el.textContent === 'Language: Rust · Manual', 'lock status');
 assert(mime === 'text/x-rustsrc', 'manual native MIME');
 assert(widget.$highlighting.el.textContent === 'Highlighting: Rust', 'manual native status');
 await widget.refreshWithNote(note);
 assert(widget.$language.el.textContent === 'Language: Rust · Manual', 'refresh preserves lock');
 labels.clear(); await api.reloadNotes(['example']);
 const reopened = new ThgSublimeStatus(); reopened.note = note; reopened.doRender();
 await reopened.refreshWithNote(note);
 assert(reopened.$language.el.textContent === 'Language: Rust · Manual', 'durable reopen with fresh cache');
 reopened.cleanup(); widget.applyTheme('mariana', false);
 widget.$languagePicker.el.focus();
 if(innerWidth > 900) await fetch('/keyboard/auto', {method:'POST'});
 else widget.$languagePicker.val('').el.dispatchEvent(new Event('change'));
 await settle();
 assert(widget.$language.el.textContent.includes('Python · Auto'), 'clear restores auto');
 await thgWriteAttribute('example', null, 'obsolete-language');
 await api.reloadNotes(['example']);
 await widget.refreshWithNote(note);
 assert(widget.$languagePicker.el.value === 'invalid-lock', 'invalid lock has distinct selection');
 assert(widget.$languagePicker.el.selectedOptions[0].disabled, 'invalid placeholder cannot be chosen');
 widget.$languagePicker.el.focus();
 widget.$languagePicker.el.value = '';
 widget.$languagePicker.el.dispatchEvent(new Event('change', {bubbles:true}));
 await settle();
 assert(!(await thgRequest('example', 'attributes', 'GET')).some(a => a.name === 'thgSublimeLanguage'), 'selector clears invalid durable override despite stale cache');
 assert(widget.$language.el.textContent.includes('Python · Auto'), 'invalid clear restores detection');
 assert(content === original && note.mime === 'text/x-python', 'content unchanged and native highlighting restored');
 assert(localStorage.getItem(THG_STORAGE) === 'mariana', 'independent theme');
 content = '';
 for(let i=0; i<5; i++) {
  await widget.refreshWithNote(note);
  assert(widget.$language.el.textContent === 'Language: Unknown · Auto', 'deleted content resets evidence');
 }
 assert(widget.$widget.el.textContent.includes('UTF-8 · LF · Spaces: 4'), 'informational fields');
 const hidden = innerWidth <= 900;
 assert((getComputedStyle(widget.$widget.el).display === 'none') === hidden, 'narrow fallback');
 assert(document.documentElement.scrollWidth <= innerWidth, 'no horizontal overflow');
 if(!hidden) for(const control of [widget.$picker.el,widget.$languagePicker.el]) {
   control.focus(); assert(document.activeElement === control, 'keyboard focus');
   const r = control.getBoundingClientRect(); assert(r.width > 40 && r.right <= innerWidth, 'visible control');
 }
 document.body.className='mobile';
 assert(getComputedStyle(widget.$widget.el).display === 'none', 'mobile fallback');
 widget.cleanup();
 assert(!document.documentElement.hasAttribute('data-thg-sublime'), 'cleanup');
 await fetch('/result',{method:'POST',body:'PASS language controls'});
})().catch(e=>fetch('/result',{method:'POST',body:'FAIL '+e.message}));
</script>
